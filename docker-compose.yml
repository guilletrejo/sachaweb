# Docker Compose runs multiple services (containers) together.
# For Phase 3, we just need PostgreSQL. Later phases add Redis, the app itself, etc.
#
# WHAT IS DOCKER COMPOSE?
# Docker runs applications in isolated containers (like lightweight VMs).
# Docker Compose defines multi-container setups in a single YAML file.
# `docker compose up -d` starts everything in the background.
# `docker compose down` stops everything.
# `docker compose down -v` stops AND deletes all data (fresh start).
#
# WHY NOT INSTALL POSTGRESQL DIRECTLY?
# 1. Reproducibility: Every developer gets the exact same PostgreSQL version.
# 2. Clean environment: No system-level installation to manage.
# 3. Easy reset: `docker compose down -v` deletes all data and starts fresh.
# 4. Matches production: Production runs in containers too.
services:
  postgres:
    image: postgres:16-alpine   # Official PostgreSQL 16, Alpine Linux (tiny image ~80MB)
    container_name: sachaweb-db
    environment:
      # These environment variables configure PostgreSQL on first startup.
      # PostgreSQL creates this user, password, and database automatically.
      POSTGRES_USER: sachaweb
      POSTGRES_PASSWORD: sachaweb
      POSTGRES_DB: sachaweb
    ports:
      - "5432:5432"   # Map container port 5432 → host port 5432.
                       # Your Go app connects to localhost:5432 as if
                       # PostgreSQL were installed locally.
    volumes:
      - pgdata:/var/lib/postgresql/data   # Persist data between container restarts

    # Healthcheck lets Docker (and your Go app) know when Postgres is ready
    # to accept connections. pg_isready is a built-in PostgreSQL utility.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sachaweb"]
      interval: 5s
      timeout: 5s
      retries: 5

# Named volumes persist data outside the container's filesystem.
# Without this, all your data would be lost every time you run `docker compose down`.
# `docker compose down -v` explicitly removes volumes (for a clean reset).
volumes:
  pgdata:
